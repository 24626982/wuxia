name: Publish game to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Cache Godot editor and Web template
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot/Godot_v4.7.2-stable_linux.x86_64
            ~/.local/share/godot/export_templates/4.7.2.stable/web_nothreads_release.zip
          key: godot-4.7.2-stable-linux-web
      - name: Install Godot 4.7.2
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p "$HOME/godot" "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          base=https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable
          curl -fL --retry 3 "$base/Godot_v4.7.2-stable_linux.x86_64.zip" -o /tmp/godot-editor.zip
          unzip -q /tmp/godot-editor.zip -d "$HOME/godot"
          chmod +x "$HOME/godot/Godot_v4.7.2-stable_linux.x86_64"
          curl -fL --retry 3 "$base/Godot_v4.7.2-stable_export_templates.tpz" -o /tmp/godot-templates.tpz
          python3 - <<'PY'
          import pathlib
          import zipfile

          target = pathlib.Path.home() / '.local/share/godot/export_templates/4.7.2.stable/web_nothreads_release.zip'
          with zipfile.ZipFile('/tmp/godot-templates.tpz') as archive:
              with archive.open('templates/web_nothreads_release.zip') as source, target.open('wb') as destination:
                  while chunk := source.read(1024 * 1024):
                      destination.write(chunk)
          PY
      - name: Import project assets
        run: "$HOME/godot/Godot_v4.7.2-stable_linux.x86_64" --headless --path . --editor --import --quit
      - name: Export Web game
        run: |
          mkdir -p builds/web
          "$HOME/godot/Godot_v4.7.2-stable_linux.x86_64" --headless --path . --export-release Web builds/web/index.html
          touch builds/web/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: builds/web

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
